version: '3.8'

services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: imoveisai-db
    environment:
      POSTGRES_DB: ${DB_NAME:-imoveisai}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
